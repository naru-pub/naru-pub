<!doctype html>
<meta charset="utf-8" />
<title>Naru SDK local browser acceptance</title>
<h1>Naru SDK local browser acceptance</h1>
<p>
  Uses the local SDK with the browser's own storage, fetch and canvas, and
  simulated API responses. No production requests.
</p>
<button id="run">Run checks</button>
<button id="reload">Check page reload</button>
<pre id="results" role="status">Ready</pre>
<script type="module">
  import {
    collection,
    NaruDataError,
    ownerSession,
  } from "/sdk/1.0.0/naru-data.js";
  const site = { site: "sdk-browser-test" };
  const sessionKey = `naru:owner:https://naru.pub:sdk-browser-test:${location.origin}${location.pathname}`;
  const reloadKey = "naru-sdk-fixture-reload";
  const output = document.querySelector("#results");
  const check = (condition, message) => {
    if (!condition) throw new Error(message);
    output.textContent += "\nPASS " + message;
  };
  const saveSession = (expiresAt) =>
    sessionStorage.setItem(
      sessionKey,
      JSON.stringify({ accessToken: "t".repeat(43), expiresAt }),
    );

  const reloadDeadline = sessionStorage.getItem(reloadKey);
  if (reloadDeadline) {
    try {
      const owner = await ownerSession(site);
      output.textContent =
        owner?.expiresAt === Number(reloadDeadline)
          ? "PASS actual page reload restores the original deadline"
          : "FAIL page reload changed or lost the deadline";
    } finally {
      sessionStorage.removeItem(reloadKey);
      sessionStorage.removeItem(sessionKey);
    }
  }
  document.querySelector("#reload").onclick = () => {
    const expiresAt = Date.now() + 60000;
    saveSession(expiresAt);
    sessionStorage.setItem(reloadKey, String(expiresAt));
    location.reload();
  };

  // A large, busy PNG, so the browser's real encoder does the shrinking.
  async function photo(width, height) {
    const canvas = new OffscreenCanvas(width, height);
    const context = canvas.getContext("2d");
    for (let y = 0; y < height; y += 8)
      for (let x = 0; x < width; x += 8) {
        context.fillStyle = `rgb(${(x * 7) % 255},${(y * 13) % 255},${(x ^ y) % 255})`;
        context.fillRect(x, y, 8, 8);
      }
    const blob = await canvas.convertToBlob({ type: "image/png" });
    return new File([blob], "big.png", { type: "image/png" });
  }

  document.querySelector("#run").onclick = async () => {
    output.textContent = "Running";
    const original = window.fetch;
    try {
      saveSession(Date.now() + 60000);
      const owner = await ownerSession(site);
      check(
        owner?.expiresAt > Date.now(),
        "native sessionStorage restores a session",
      );

      const calls = [];
      window.fetch = async (url, init = {}) => {
        calls.push({ url: new URL(url), ...init });
        return Response.json(
          init.method === "PUT"
            ? {
                id: "one",
                version: 2,
                createdAt: "2026-01-01T00:00:00Z",
                updatedAt: "2026-01-01T00:00:00Z",
              }
            : { documents: [], nextPageToken: null },
        );
      };
      const notes = collection("notes", site);
      await notes.list({ where: { tag: "한글" } });
      await owner
        .collection("notes")
        .set("one", { title: "x" }, { ifVersion: 1 });
      await notes.list({ where: { tag: "한글" } });
      check(
        JSON.parse(calls[0].url.searchParams.get("where")).tag === "한글",
        "Korean filters survive URL encoding",
      );
      check(
        calls[0].cache === "default" &&
          !calls[0].headers.Authorization &&
          calls[1].headers.Authorization === `Bearer ${"t".repeat(43)}` &&
          calls[2].cache === "no-store",
        "public reads use the cache until this browser writes",
      );

      window.fetch = (_url, init) => original("/slow", init);
      const controller = new AbortController();
      const pending = notes.list({ signal: controller.signal });
      controller.abort();
      let aborted = false;
      try {
        await pending;
      } catch (error) {
        aborted = error.name === "AbortError";
      }
      check(aborted, "native fetch cancellation surfaces as AbortError");

      window.fetch = async () => new Response("<html>", { status: 401 });
      let expired = false;
      try {
        await owner.collection("notes").get("one");
      } catch (error) {
        expired =
          error instanceof NaruDataError &&
          error.code === "OWNER_SESSION_EXPIRED";
      }
      check(
        expired && !sessionStorage.getItem(sessionKey),
        "an HTML 401 ends the session and clears storage",
      );

      saveSession(Date.now() + 60000);
      const uploader = await ownerSession(site);
      const declared = [];
      window.fetch = async (url, init = {}) => {
        if (String(url).endsWith("/upload")) return original("/upload", init);
        if (init.method === "POST") {
          declared.push(JSON.parse(init.body));
          return Response.json({
            file: { id: "browser_file", status: "pending" },
            uploadUrl: `${location.origin}/upload`,
            method: "PUT",
            headers: {},
          });
        }
        return Response.json({
          file: { id: "browser_file", status: "ready" },
        });
      };
      const source = await photo(4096, 2048);
      const stored = await uploader.files.upload(source);
      check(
        stored.status === "ready",
        "native upload authorizes, transfers and finalizes",
      );
      const sent = declared[0];
      check(
        ["image/webp", "image/jpeg"].includes(sent.contentType) &&
          sent.size < source.size &&
          /^big\.(webp|jpeg)$/.test(sent.name),
        `native canvas shrinks a 4096px PNG (${source.size} → ${sent.size} bytes, ${sent.contentType})`,
      );
      output.textContent += "\nALL CHECKS PASSED";
    } catch (error) {
      output.textContent += "\nFAIL " + error.message;
    } finally {
      window.fetch = original;
      sessionStorage.removeItem(sessionKey);
    }
  };
</script>
