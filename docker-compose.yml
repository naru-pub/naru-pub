# Built by CI and pulled from ghcr.io by deploy-server.sh, or built on another
# machine and loaded here by `deploy.sh build`; deploy-server.sh points the
# :current tags at the release before recreating anything. There is
# deliberately no `build:`: a build here is what ran this machine out of memory.
# Without one, a missing image would send compose to Docker Hub, so fail
# instead.
# Fixed rather than taken from the directory's name.
name: naru

x-control-plane: &control-plane
  image: naru-control-plane:current
  pull_policy: never
  # deploy.sh stops the slot that is not serving. `always` would bring it back
  # whenever the Docker daemon restarts; this leaves it stopped.
  restart: unless-stopped
  # Forwards SIGTERM to the app, which as PID 1 would otherwise be exempt from
  # the default action and sit out the ten seconds until Docker kills it.
  init: true
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    # The web image has no wget or curl; node is what it has.
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
      ]
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

services:
  gateway:
    image: nginx:1.30.4-alpine
    container_name: naru-gateway
    restart: always
    ports:
      - "40000:3000"
    volumes:
      - ./.deploy-state/nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3

  control-plane-blue:
    <<: *control-plane

  control-plane-green:
    <<: *control-plane

  # The jobs image: the compiled CLIs, and Chromium for screenshots. The web
  # image above is only the Next.js server and cannot run these.
  worker:
    stop_grace_period: 5m
    image: naru-control-plane-jobs:current
    pull_policy: never
    restart: always
    # Compiled by scripts/build-cli.mjs, so plain node with no tsx loader.
    command: ["node", "dist/cli/worker.mjs"]
    init: true
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
