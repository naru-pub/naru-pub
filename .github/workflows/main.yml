name: main
on:
  push:
    branches:
      - main

jobs:
  image-control-plane:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: arch
        run: echo arch=arm64 >> "$GITHUB_OUTPUT"
      # Two targets of one Dockerfile: the Next.js standalone server, and the
      # image worker and migrations run from. The second build reuses the
      # first's dependency install from this builder's cache.
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          target: web
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-control-plane:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          target: jobs
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-control-plane-jobs:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane-jobs:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-control-plane-jobs:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false

  # The payment tests: unit tests, then the database tests against a throwaway
  # PostgreSQL cluster the script starts itself. Part of the run deploy.sh
  # checks, so a payment regression never reaches the server.
  test-payments:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same pnpm as the Dockerfile.
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:payments
      # Only the server binaries are needed; the script runs its own cluster
      # on a private socket.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-16 postgresql-16-cron
      - run: pnpm test:payments:db
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/16/bin

      - run: bash scripts/test-payment-schedules-db.sh
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/16/bin

  # Everything else in the control plane: the unit suites, then the board and
  # site-data database tests, each against a throwaway PostgreSQL cluster and
  # a local edge Worker its script starts. Like test-payments, part of
  # the run deploy.sh checks.
  test-control-plane:
    defaults:
      run:
        working-directory: control-plane
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same pnpm as the Dockerfile.
      - run: npm install --global pnpm@11.5.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:data
      - run: pnpm test:node
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-16
      # Site databases are Durable Objects: the database suites start the
      # edge Worker under `wrangler dev` (scripts/with-edge-worker.sh).
      - run: pnpm install --frozen-lockfile
        working-directory: edge
      # The object's list query against SQLite, without a Worker.
      - run: pnpm test
        working-directory: edge
      - run: pnpm test:board
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      - run: pnpm test:data:db
        env:
          NARU_TEST_PG_BIN: /usr/lib/postgresql/16/bin

  test-proxy:
    defaults:
      run:
        working-directory: proxy
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as proxy/Dockerfile.
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo test --locked

  image-proxy:
    defaults:
      run:
        working-directory: proxy
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: arch
        run: echo arch=arm64 >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: proxy
          pull: "true"
          push: "true"
          no-cache: "false"
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-proxy:git-${{ github.sha }}-${{ steps.arch.outputs.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-proxy:build-cache-${{ steps.arch.outputs.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-proxy:build-cache-${{ steps.arch.outputs.arch }},mode=max
          provenance: false
  # Runs the images just pushed as a deploy would. deploy.sh deploys only a
  # commit whose whole run succeeded, so a failure here keeps it off the server.
  smoke-test-control-plane:
    needs: image-control-plane
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          image=ghcr.io/${{ github.repository }}-control-plane
          tag=git-${{ github.sha }}-arm64
          docker pull --quiet "$image:$tag"
          docker pull --quiet "$image-jobs:$tag"
          control-plane/scripts/smoke-test-images.sh "$image:$tag" "$image-jobs:$tag"
